<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ঘুরবে (Ghurbe) — ট্যুরস অ্যান্ড ট্রাভেলস</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var isCustomDomain = l.hostname.indexOf('github.io') === -1;
      if (!isCustomDomain) {
        pathSegmentsToKeep = 1;
      }
      l.replace(
        l.protocol + '//' + l.host + (pathSegmentsToKeep ? '/' + l.pathname.slice(1).split('/')[0] : '') + '/?' +
        (l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') ? 'p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') : '') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
