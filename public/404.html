<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ঘুরবে (Ghurbe) — ট্যুরস অ্যান্ড ট্রাভেলস</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Keeps the path and forwards to index.html with query/hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.host + '/' + l.pathname.slice(1).split('/')[0] + '/#' + (path ? '/' + path : '') + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Ghurbe Travels...</p>
  </body>
</html>
